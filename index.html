<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>单词消消乐</title>
<style>
:root{--g:8px;--h:60px;--bw:min(calc(100vw - 24px),460px);--w:calc((var(--bw) - 5*var(--g)) / 4);--ink:#1e1b4b;--acc:#6366f1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{margin:0;background:linear-gradient(160deg,#f5f3ff,#fdf4ff 55%,#fff7ed);background-attachment:fixed;min-height:100vh;font-family:-apple-system,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;color:var(--ink);display:flex;justify-content:center}
.wrap{width:100%;max-width:484px;padding:16px 12px 36px;text-align:center}
h1{margin:10px 0 6px;font-size:28px;font-weight:800;letter-spacing:1px;color:#312e81}
.sub{color:#6b6894;margin-bottom:20px;font-size:14px;line-height:1.6}
#levels{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.lv{background:#fff;border-radius:16px;padding:14px 4px 10px;font-weight:700;font-size:20px;box-shadow:0 1px 2px #1e1b4b14,0 6px 16px #6366f114;border:1px solid #e8e6fb;cursor:pointer;color:var(--ink)}
.lv small{display:block;font-size:12px;letter-spacing:2px;margin-top:3px;color:#f59e0b;min-height:16px}
.lv.lock{opacity:.45;cursor:not-allowed;box-shadow:none}
.lv.lock small{color:#8b88b0;letter-spacing:0}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.pill{background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;border:1px solid #e8e6fb;color:#4338ca}
button.btn{background:var(--acc);color:#fff;border:0;border-radius:999px;padding:11px 24px;font-size:15px;font-weight:600;box-shadow:0 6px 14px #6366f13d;cursor:pointer}
button.btn.alt{background:#fff;color:#4338ca;border:1px solid #e0defa;box-shadow:none;padding:9px 16px}
.prog{height:8px;background:#e8e6fb;border-radius:99px;overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#818cf8,#a78bfa);border-radius:99px;transition:width .4s}
#board{position:relative;margin:0 auto;overflow:hidden;background:#ffffffa6;border:1px solid #e8e6fb;border-radius:20px;width:var(--bw);height:calc(9*var(--h) + 8*var(--g) + 2*var(--g))}
#inner{position:absolute;left:var(--g);top:var(--g);right:0;bottom:0}
.tile{position:absolute;left:0;top:0;width:var(--w);height:var(--h);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:calc(var(--w)*.125);font-weight:600;line-height:1.25;padding:2px 3px;letter-spacing:-.2px;text-align:center;overflow-wrap:anywhere;transition:transform .22s ease,opacity .25s,box-shadow .15s;cursor:pointer}
.k0{background:#eef0ff;color:#3730a3;border:1.5px solid #c9ceff}
.k1{background:#fff3e4;color:#9a3412;border:1.5px solid #fcd9b0}
.slot{position:absolute;left:0;top:0;width:var(--w);height:var(--h);border-radius:14px;background:#6366f10a;border:1.5px dashed #6366f124}
.tile.sel{background:#fff;border-color:var(--acc);box-shadow:0 0 0 3px #6366f13a;z-index:3}
.k1.sel{border-color:#f97316;box-shadow:0 0 0 3px #f9731638}
.tile.hint{animation:hint .5s 3}
.tile.spawn{animation:spawn .3s}
.tile.pop{animation:pop .26s forwards;z-index:4}
.tile.shake{animation:shake .25s;border-color:#f43f5e}
@keyframes spawn{from{opacity:0;transform:scale(.3) var(--t)}}
@keyframes pop{40%{transform:scale(1.1) var(--t)}100%{opacity:0;transform:scale(.4) var(--t)}}
@keyframes hint{50%{box-shadow:0 0 0 4px #6366f155}}
@keyframes shake{25%{margin-left:-5px}75%{margin-left:5px}}
.foot{margin-top:16px;display:flex;gap:10px;justify-content:center}
.tip{margin-top:12px;font-size:13px;color:#6b6894;line-height:1.6}
#modal{position:fixed;inset:0;background:#1e1b4b66;display:none;align-items:center;justify-content:center;padding:14px;z-index:10}
.card{background:#fff;border-radius:22px;padding:22px 20px;max-width:460px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 20px 50px #1e1b4b40}
.card h2{margin:0 0 8px;font-size:20px;color:#312e81}
.words{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;text-align:left;font-size:14px;margin:12px 0 18px}
.words b{color:#4338ca}
.stars{font-size:36px;color:#f59e0b;margin:6px 0;letter-spacing:4px}
</style>
</head>
<body>
<div class="wrap">
 <div id="home">
  <h1>单词消消乐</h1>
  <div class="sub">高考 3500 词 · 每天一关，每关 30 词<br>把英文和它的中文换到一起就消除</div>
  <div id="levels"></div>
 </div>
 <div id="game" style="display:none">
  <div class="bar">
   <button class="btn alt" id="back">← 关卡</button>
   <span class="pill" id="lvl"></span>
   <span class="pill" id="moves"></span>
  </div>
  <div class="prog"><i id="pbar"></i></div>
  <div id="board"><div id="inner"></div></div>
  <div class="foot"><button class="btn alt" id="hint">💡 提示</button><button class="btn alt" id="words">📖 本关单词</button></div>
  <div class="tip">先点英文（蓝），再点它的中文意思（橙），配对对了就消掉。30 个词全部配完过关，点错会记一次错误。</div>
 </div>
</div>
<div id="modal"><div class="card" id="card"></div></div>

<script>
const RAW=`a (an)|一个

Australian|澳大利亚人

award|奖品
aware|意识到的

awesome|令人惊叹的
awful|很坏的
awkward|尴尬的`;
const W=RAW.trim().split('\n').map(l=>{const i=l.indexOf('|');return{en:l.slice(0,i),zh:l.slice(i+1)}});
const R=9,C=4,PER=30,NLV=Math.ceil(W.length/PER);
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let save={stars:[]};
try{save=JSON.parse(localStorage.getItem('wordcrush')||'{"stars":[]}')}catch(e){}
const store=()=>{try{localStorage.setItem('wordcrush',JSON.stringify(save))}catch(e){}};
function lvInfo(i){const start=Math.min(i*PER,W.length-PER);return{start,pool:Array.from({length:PER},(_,k)=>start+k)}}
function dayIdx(){
  if(!save.start){save.start=new Date().toDateString();store()}
  return Math.max(0,Math.round((new Date(new Date().toDateString())-new Date(save.start))/864e5));
}
function renderHome(){
  const box=$('levels');box.innerHTML='';
  for(let i=0;i<NLV;i++){
    const unlocked=i===0||(save.stars[i-1]>0&&i<=dayIdx());
    const b=document.createElement('button');
    b.className='lv'+(unlocked?'':' lock');
    const s=save.stars[i]||0;
    b.innerHTML=(i+1)+'<small>'+(s?'★'.repeat(s)+'☆'.repeat(3-s):(unlocked?'':(i<=dayIdx()?'🔒':'明天')))+'</small>';
    if(unlocked)b.onclick=()=>openLevel(i);
    box.appendChild(b);
  }
}
let L,board,uid=0,sel=null,busy=false,done=0,mistakes=0,queue=[],lvIdx;
const inner=$('inner');
function mk(w,k){
  const t={id:uid++,w,k};
  const el=document.createElement('div');
  el.className='tile k'+k;
  el.textContent=k?W[w].zh:W[w].en;
  t.el=el;
  el.addEventListener('click',()=>pick(t));
  inner.appendChild(el);
  return t;
}
function pos(t,r,c){
  const tr='translate(calc('+c+'*(var(--w) + var(--g))),calc('+r+'*(var(--h) + var(--g))))';
  t.el.style.setProperty('--t',tr);t.el.style.transform=tr;
}
const same=(a,b)=>a.k!==b.k&&W[a.w].zh===W[b.w].zh;
function locate(t){for(let r=0;r<R;r++)for(let c=0;c<C;c++)if(board[r][c]===t)return[r,c]}
function findHint(){
  const ts=board.flat().filter(Boolean);
  for(const a of ts)for(const b of ts)if(same(a,b))return[a,b];
  return null;
}
function openLevel(i){
  lvIdx=i;L=lvInfo(i);
  $('home').style.display='none';$('game').style.display='';
  inner.innerHTML='';
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){const d=document.createElement('div');d.className='slot';d.style.transform='translate(calc('+c+'*(var(--w) + var(--g))),calc('+r+'*(var(--h) + var(--g))))';inner.appendChild(d)}
  board=Array.from({length:R},()=>Array(C).fill(null));
  queue=shuf(L.pool.slice());done=0;mistakes=0;sel=null;
  const ts=[];queue.splice(0,18).forEach(w=>ts.push(mk(w,0),mk(w,1)));
  const cells=[];for(let r=0;r<R;r++)for(let c=0;c<C;c++)cells.push([r,c]);
  shuf(cells);ts.forEach((t,k)=>{const[r,c]=cells[k];board[r][c]=t;pos(t,r,c)});
  hud();showWords(true);
}
function hud(){
  $('lvl').textContent='第 '+(lvIdx+1)+' 关 · 已配对 '+done+'/'+PER;
  $('moves').textContent='错误 '+mistakes;
  $('pbar').style.width=(done/PER*100)+'%';
}
function modal(html){$('card').innerHTML=html;$('modal').style.display='flex'}
function closeModal(){$('modal').style.display='none'}
function showWords(start){
  modal('<h2>第 '+(lvIdx+1)+' 关 · 今日 30 词</h2><div>把每个英文和它的中文配对消掉，先扫一眼：</div><div class="words">'+
    L.pool.map(w=>'<div><b>'+W[w].en+'</b> '+W[w].zh+'</div>').join('')+'</div>'+
    '<button class="btn" id="go">'+(start?'开始':'继续')+'</button>');
  $('go').onclick=closeModal;
}
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function clearSel(){if(sel)sel.el.classList.remove('sel');sel=null}
async function pick(t){
  if(busy||!t.el.isConnected)return;
  if(!sel){sel=t;t.el.classList.add('sel');if(!t.k)speak(W[t.w].en);return}
  if(sel===t){clearSel();return}
  if(sel.k===t.k){clearSel();sel=t;t.el.classList.add('sel');if(!t.k)speak(W[t.w].en);return}
  const a=sel;clearSel();busy=true;
  if(same(a,t)){
    speak(W[(a.k?t:a).w].en);
    a.el.classList.add('pop');t.el.classList.add('pop');
    await sleep(280);
    const[r1,c1]=locate(a),[r2,c2]=locate(t);
    board[r1][c1]=board[r2][c2]=null;a.el.remove();t.el.remove();
    done++;hud();
    if(queue.length){
      const w=queue.pop(),n=[mk(w,0),mk(w,1)];shuf(n);
      [[r1,c1],[r2,c2]].forEach(([r,c],i)=>{board[r][c]=n[i];pos(n[i],r,c);n[i].el.classList.add('spawn')});
    }
    if(done>=PER)finish();
  }else{
    mistakes++;hud();
    a.el.classList.add('shake');t.el.classList.add('shake');
    await sleep(280);
    a.el.classList.remove('shake');t.el.classList.remove('shake');
  }
  busy=false;
}
function finish(){
  const s=mistakes<=2?3:mistakes<=6?2:1;
  save.stars[lvIdx]=Math.max(save.stars[lvIdx]||0,s);store();
  modal('<h2>🎉 今日 30 词全部配对！</h2><div class="stars">'+'★'.repeat(s)+'☆'.repeat(3-s)+'</div><div>错误 '+mistakes+' 次</div><div style="margin-top:14px;display:flex;gap:10px;justify-content:center">'+
    '<button class="btn alt" id="m1">关卡</button><button class="btn" id="m3">再玩一次</button></div>');
  $('m1').onclick=()=>{closeModal();goHome()};
  $('m3').onclick=()=>{closeModal();openLevel(lvIdx)};
}
function goHome(){$('game').style.display='none';$('home').style.display='';renderHome()}
$('back').onclick=goHome;
$('words').onclick=()=>showWords(false);
$('hint').onclick=()=>{
  if(busy)return;const h=findHint();if(!h)return;
  h.forEach(t=>{t.el.classList.add('hint');setTimeout(()=>t.el.classList.remove('hint'),1600)});
};
renderHome();
</script>
</body>
</html>
